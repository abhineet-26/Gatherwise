name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      - name: Secret scan (tracked files)
        run: |
          if git grep -InE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----'; then
            echo "Possible secret committed"; exit 1
          fi
      - name: Secret scan (client bundle)
        run: |
          if grep -rEl 'AIza[0-9A-Za-z_-]{35}|GEMINI_API_KEY' dist/client 2>/dev/null; then
            echo "Secret-like string in client bundle"; exit 1
          fi
      - name: Dependency audit (reported, non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
