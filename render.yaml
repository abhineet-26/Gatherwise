services:
  - type: web
    name: gatherwise
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
